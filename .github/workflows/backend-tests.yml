name: Backend Tests & Lint

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: rpg_user
          POSTGRES_PASSWORD: secure_password_test
          POSTGRES_DB: aetheria_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    # Установка зависимостей внутри папки backend
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pytest pytest-asyncio httpx
    
    - name: Run Linter (Flake8)
      working-directory: ./backend
      run: |
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Run Tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://rpg_user:secure_password_test@localhost:5432/aetheria_rpg_test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        SECRET_KEY: test-secret-key-ci
        INFERENCE_API_KEY: test-key
        INFERENCE_API_BASE_URL: http://test-url
        VK_APP_ID: test-id
        VK_CLIENT_SECRET: test-secret
        DEBUG: True
      run: |
        if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
          pytest tests/ -v
        else
          echo "No tests found yet. Skipping pytest."
        fi
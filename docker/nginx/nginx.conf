events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Настройка логирования
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Upstream для Backend (FastAPI)
    # Имя сервиса должно совпадать с именем в docker-compose.prod.yml (backend)
    upstream backend {
        server backend:8000;
    }

    # Upstream для Frontend (React Dev Server или сборка)
    # Имя сервиса должно совпадать с именем в docker-compose.prod.yml (frontend)
    # Порт 3000 используется, если фронтенд запускается через npm start в контейнере
    upstream frontend {
        server frontend:3000;
    }

    # HTTP Server (Порт 80)
    server {
        listen 80;
        server_name _; # Принимает запросы на любой домен/IP по умолчанию

        # Раскомментировать строку ниже ТОЛЬКО ПОСЛЕ настройки SSL, чтобы перенаправлять весь трафик на HTTPS
        # return 301 https://$host$request_uri;

        # Проксирование запросов к Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Передача реального IP клиента
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Проксирование API запросов к Backend
        # Все запросы, начинающиеся с /api, уходят на FastAPI
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Увеличение таймаутов для долгих запросов (например, к AI)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS Server (Порт 443)
    # АКТИВИРОВАТЬ ТОЛЬКО ПОСЛЕ ПОЛУЧЕНИЯ СЕРТИФИКАТА CERTBOT
    # Пути к сертификатам должны совпадать с volume в docker-compose.prod.yml

version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: aetheria-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: X7mpL9$vQ2@zR4!
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - aetheria-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aetheria-redis-prod
    restart: always
    networks:
      - aetheria-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aetheria-backend-prod
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      INFERENCE_API_KEY: ${INFERENCE_API_KEY}
      INFERENCE_API_BASE_URL: ${INFERENCE_API_BASE_URL}
      INFERENCE_MODEL: ${INFERENCE_MODEL}
      VK_APP_ID: ${VK_APP_ID}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: False
      ALLOWED_ORIGINS: https://vk.com,https://m.vk.com,https://${DOMAIN_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aetheria-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/api
    container_name: aetheria-frontend-prod
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - aetheria-net

  nginx:
    image: nginx:alpine
    container_name: aetheria-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl/certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aetheria-net

networks:
  aetheria-net:
    driver: bridge

volumes:
  postgres_prod_data: